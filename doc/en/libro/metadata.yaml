geometry:
  - inner=1.9cm
  - outer=1.4cm
  - top=1.6cm
  - bottom=1.7cm
mainfont: DejaVu Serif
sansfont: DejaVu Sans
monofont: DejaVu Sans Mono
mainfontoptions: [Scale=0.93]
monofontoptions: [Scale=0.85]
colorlinks: true
linkcolor: black
urlcolor: blue
toccolor: black
highlight-style: tango
...
