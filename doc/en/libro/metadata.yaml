# Metadatos del instruction book de AFS (pandoc + XeLaTeX). A5 page size.
lang: en
title-meta: "Alea's Flight Simulator 1.0 for Sinclair QL - Instruction manual"
author-meta: "Alvaro Alea"
papersize: a5
fontsize: 10pt
documentclass: book
classoption:
